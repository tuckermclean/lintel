template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: LINTEL_REQUIRE_XVFB=1 cargo test
  fail_pattern: '^test \S+ \.\.\. FAILED$'
  known_red:
    - real_pointer_and_keyboard
out_of_scope:
  - {glob: "Cargo.lock", reason: "generated by cargo"}
  - {glob: "LICENSE-APACHE", reason: "license text"}
  - {glob: "LICENSE-MIT", reason: "license text"}
  - {glob: "CLAUDE.md", reason: "a pointer to AGENTS.md, with no rules of its own"}
adoption:
  areas:
    - {name: layout, globs: ["src/layout.rs"]}
    - {name: wm, globs: ["src/wm.rs", "src/lib.rs", "src/main.rs", "tests/xvfb.rs"]}
    - {name: build, globs: ["Cargo.toml", "rustfmt.toml", ".gitignore", "targets/", "tools/", ".github/"]}
    - {name: docs, globs: ["README.md", "CHANGELOG.md"]}
nodes: []
