name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.75"]
    env:
      LINTEL_REQUIRE_XVFB: 1
    steps:
      # protolith is a path dependency (../protolith): check both out side by side.
      - uses: actions/checkout@v4
        with:
          path: lintel
      - uses: actions/checkout@v4
        with:
          repository: tuckermclean/protolith
          path: protolith
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - working-directory: lintel
        run: |
          cargo fmt --check
          RUSTFLAGS="-D warnings" cargo clippy --all-targets
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cargo test
          for i in $(seq 1 10); do cargo test -q -- --test-threads=16 || exit 1; done

  # The build that matters: a Pentium, stretching to a 486DX2. Built the way
  # Stele is built, in the same pinned image (the i486 musl cross toolchain
  # lives only there), and held to a size budget.
  i486:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tuckermclean/monolith-builder@sha256:c8978fe3b56cf6ec1714b1b878997c7082cbf9786caa2b8cbcdbd986169c0daf
    steps:
      - uses: actions/checkout@v4
        with:
          path: lintel
      - uses: actions/checkout@v4
        with:
          repository: tuckermclean/protolith
          path: protolith
      - working-directory: lintel
        run: INSIDE_BUILDER=1 STRIP=true sh tools/build-i486.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lintel-i486
          path: lintel/target-i486/i486-monolith-linux-musl/release/lintel
